
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goswami Connect</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #075e54; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    #auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; padding: 20px; text-align: center; }
    .btn { background-color: #4285f4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    #chat-container { display: none; flex-direction: column; height: calc(100vh - 60px); }
    #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: white; padding: 10px 15px; border-radius: 10px; max-width: 80%; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg.me { background: #dcf8c6; align-self: flex-end; }
    .msg .sender { font-size: 11px; color: #666; margin-bottom: 3px; font-weight: bold; }
    .input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ccc; }
    .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .input-area button { background: #128c7e; color: white; border: none; padding: 10px 20px; margin-left: 8px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <header>Goswami Connect</header>

  <!-- Login Section -->
  <div id="auth-container">
    <h2>Goswami Connect में आपका स्वागत है</h2>
    <p style="margin-top: 8px; color: #555;">चैट करने के लिए अपने Google अकाउंट से लॉगिन करें</p>
    <button class="btn" onclick="login()">Google से लॉगिन करें</button>
  </div>

  <!-- Chat Section -->
  <div id="chat-container">
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="संदेश लिखें...">
      <button onclick="sendMessage()">भेजें</button>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA7rXpYUYHrf5Q2bfoCZOVXYzDl6CKOkoA",
      authDomain: "goswami-connect.firebaseapp.com",
      projectId: "goswami-connect",
      storageBucket: "goswami-connect.firebasestorage.app",
      messagingSenderId: "771765927522",
      appId: "1:771765927522:web:e3344d9b61f291b3519b3b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;

    // Login Function
    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => alert(error.message));
    }

    // Check Auth State
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        loadMessages();
      } else {
        document.getElementById('auth-container').style.display = 'flex';
        document.getElementById('chat-container').style.display = 'none';
      }
    });

    // Send Message
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text && currentUser) {
        db.collection('messages').add({
          text: text,
          sender: currentUser.displayName || 'यूजर',
          uid: currentUser.uid,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
      }
    }

    // Load Live Messages
    function loadMessages() {
      db.collection('messages').orderBy('timestamp', 'asc')
        .onSnapshot(snapshot => {
          const msgContainer = document.getElementById('messages');
          msgContainer.innerHTML = '';
          snapshot.forEach(doc => {
            const data = doc.data();
            const div = document.createElement('div');
            const isMe = data.uid === currentUser.uid;
            div.className = `msg ${isMe ? 'me' : ''}`;
            div.innerHTML = `<div class="sender">${data.sender}</div>${data.text}`;
            msgContainer.appendChild(div);
          });
          msgContainer.scrollTop = msgContainer.scrollHeight;
        });
    }
  </script>
</body>
</html>
